<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookVerse - Temukan Cerita Favoritmu</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0B132B',
              dark: '#1C2541',
              accent: '#F59E0B', // Gold/Orange
              accentHover: '#D97706',
              softBg: '#F8FAFC'
            }
          }
        }
      }
    }
  </script>

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Mock Initial Data ---
    const CATEGORIES = [
      { id: 'buku', name: 'Buku Utama', count: '1,200+', icon: 'book-open' },
      { id: 'komik', name: 'Komik & Manga', count: '850+', icon: 'sparkles' },
      { id: 'novel', name: 'Novel & Fiksi', count: '2,100+', icon: 'book' },
      { id: 'pendidikan', name: 'Pendidikan', count: '500+', icon: 'graduation-cap' },
      { id: 'fiksi', name: 'Fiksi Spekulatif', count: '940+', icon: 'compass' },
      { id: 'non-fiksi', name: 'Non-Fiksi', count: '1,500+', icon: 'lightbulb' },
      { id: 'manga', name: 'Manga Jepang', count: '620+', icon: 'feather' },
      { id: 'self-improvement', name: 'Self Improvement', count: '780+', icon: 'trending-up' }
    ];

    const INITIAL_PRODUCTS = [
      {
        id: 1,
        title: 'Atomic Habits',
        author: 'James Clear',
        publisher: 'Gramedia Pustaka Utama',
        isbn: '978-602-06-3317-6',
        category: 'self-improvement',
        categoryLabel: 'Self Improvement',
        price: 108000,
        originalPrice: 120000,
        discount: 10,
        rating: 4.9,
        reviewsCount: 1420,
        isBestSeller: true,
        isNew: false,
        pages: 356,
        description: 'Perubahan Kecil yang Memberikan Hasil Luar Biasa. Cara mudah dan terbukti untuk membangun kebiasaan baik.',
        cover: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 2,
        title: 'One Piece Vol. 100',
        author: 'Eiichiro Oda',
        publisher: 'Elex Media Komputindo',
        isbn: '978-623-00-3120-1',
        category: 'komik',
        categoryLabel: 'Komik',
        price: 45000,
        originalPrice: 50000,
        discount: 10,
        rating: 5.0,
        reviewsCount: 2310,
        isBestSeller: true,
        isNew: true,
        pages: 192,
        description: 'Pertempuran puncak di Onigashima semakin sengit! Akankah Luffy mengalahkan Kaido?',
        cover: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 3,
        title: 'Bumi',
        author: 'Tere Liye',
        publisher: 'Gramedia Pustaka Utama',
        isbn: '978-602-03-0112-9',
        category: 'novel',
        categoryLabel: 'Novel',
        price: 89000,
        originalPrice: 99000,
        discount: 10,
        rating: 4.8,
        reviewsCount: 980,
        isBestSeller: true,
        isNew: false,
        pages: 440,
        description: 'Namaku Raib, usiaku 15 tahun. Aku bisa menghilang. Petualangan dunia paralel dimulai.',
        cover: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 4,
        title: 'Filosofi Teras',
        author: 'Henry Manampiring',
        publisher: 'Penerbit Kompas',
        isbn: '978-602-412-518-9',
        category: 'self-improvement',
        categoryLabel: 'Self Improvement',
        price: 98000,
        originalPrice: 115000,
        discount: 15,
        rating: 4.9,
        reviewsCount: 1850,
        isBestSeller: true,
        isNew: false,
        pages: 320,
        description: 'Penerapan Filsafat Stoisisme dalam kehidupan sehari-hari untuk mental yang lebih tangguh.',
        cover: 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?auto=format&fit=crop&w=600&q=80'
      }
    ];

    function App() {
      const [darkMode, setDarkMode] = useState(false);
      const [cart, setCart] = useState([]);
      const [wishlist, setWishlist] = useState([]);
      const [activeTab, setActiveTab] = useState('home');
      const [searchQuery, setSearchQuery] = useState('');
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [newsletterSuccess, setNewsletterSuccess] = useState(false);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        setTimeout(() => lucide.createIcons(), 100);
      }, [darkMode, activeTab, selectedProduct, isCartOpen]);

      const formatIDR = (price) => {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(price);
      };

      const addToCart = (product) => {
        setCart(prev => {
          const exist = prev.find(item => item.id === product.id);
          if (exist) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1 }];
        });
        setIsCartOpen(true);
      };

      const toggleWishlist = (product) => {
        setWishlist(prev => {
          const exist = prev.find(item => item.id === product.id);
          if (exist) return prev.filter(item => item.id !== product.id);
          return [...prev, product];
        });
      };

      const cartTotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
      const cartCount = cart.reduce((acc, item) => acc + item.qty, 0);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Announcement Bar */}
          <div className="bg-brand-navy text-white text-xs py-2 text-center font-medium tracking-wide dark:bg-black">
            <span>🎉 Promo Spesial BookVerse: Gunakan kode <strong className="text-brand-accent">BOOKVERSE10</strong> untuk diskon 10%!</span>
          </div>

          {/* Sticky Navbar */}
          <header className="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
              
              {/* Logo */}
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                <div className="w-10 h-10 rounded-xl bg-brand-accent flex items-center justify-center text-slate-900 font-extrabold text-xl shadow-lg shadow-amber-500/20">
                  BV
                </div>
                <div>
                  <span className="text-2xl font-black tracking-tight text-slate-900 dark:text-white">Book<span className="text-brand-accent">Verse</span></span>
                  <span className="block text-[10px] text-slate-400 font-medium tracking-widest uppercase">Temukan Cerita Favoritmu</span>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="hidden md:flex items-center gap-8 font-semibold text-sm">
                {['home', 'buku', 'komik', 'novel', 'best-seller', 'promo'].map(tab => (
                  <button 
                    key={tab}
                    onClick={() => setActiveTab(tab)}
                    className={`capitalize transition-colors hover:text-brand-accent ${activeTab === tab ? 'text-brand-accent font-bold' : 'text-slate-600 dark:text-slate-300'}`}
                  >
                    {tab.replace('-', ' ')}
                  </button>
                ))}
              </nav>

              {/* Actions */}
              <div className="flex items-center gap-3">
                {/* Search Input */}
                <div className="relative hidden lg:block w-64">
                  <input 
                    type="text" 
                    placeholder="Cari buku, penulis, ISBN..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-10 pr-4 py-2 text-sm bg-slate-100 dark:bg-slate-800 border-none rounded-full focus:ring-2 focus:ring-brand-accent outline-none"
                  />
                  <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                </div>

                {/* Dark Mode Toggle */}
                <button onClick={() => setDarkMode(!darkMode)} className="p-2.5 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300">
                  <i data-lucide={darkMode ? "sun" : "moon"} className="w-5 h-5"></i>
                </button>

                {/* Wishlist */}
                <button className="relative p-2.5 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300">
                  <i data-lucide="heart" className="w-5 h-5"></i>
                  {wishlist.length > 0 && (
                    <span className="absolute top-1 right-1 w-4 h-4 bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center">
                      {wishlist.length}
                    </span>
                  )}
                </button>

                {/* Cart Button */}
                <button 
                  onClick={() => setIsCartOpen(true)}
                  className="relative p-2.5 bg-slate-900 text-white dark:bg-brand-accent dark:text-slate-900 rounded-full hover:opacity-90 transition-opacity flex items-center gap-2 px-4 shadow-md"
                >
                  <i data-lucide="shopping-bag" className="w-5 h-5"></i>
                  <span className="text-xs font-bold hidden sm:inline">{cartCount} Item</span>
                </button>
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-grow">
            {/* Hero Section */}
            {activeTab === 'home' && (
              <section className="relative overflow-hidden bg-gradient-to-b from-slate-100 to-slate-50 dark:from-slate-900 dark:to-slate-800 py-20 lg:py-32">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid md:grid-cols-2 gap-12 items-center">
                  <div>
                    <span className="inline-block px-4 py-1.5 rounded-full bg-amber-500/10 text-brand-accent text-xs font-bold uppercase tracking-wider mb-4 border border-amber-500/20">
                      Toko Buku Online Terpercaya
                    </span>
                    <h1 className="text-4xl sm:text-5xl lg:text-6xl font-black text-slate-900 dark:text-white leading-tight tracking-tight mb-6">
                      Temukan Dunia Baru di <span className="text-transparent bg-clip-text bg-gradient-to-r from-amber-500 to-orange-500">Setiap Halaman</span>
                    </h1>
                    <p className="text-lg text-slate-600 dark:text-slate-300 mb-8 max-w-lg">
                      Jelajahi koleksi buku, komik, dan novel pilihan terbaik untuk menemani setiap perjalanan imajinasi dan pengetahuanmu.
                    </p>
                    <div className="flex flex-wrap items-center gap-4">
                      <button onClick={() => setActiveTab('buku')} className="px-8 py-4 bg-brand-accent text-slate-900 font-bold rounded-xl shadow-lg shadow-amber-500/25 hover:bg-brand-accentHover transition-all flex items-center gap-2">
                        Belanja Sekarang <i data-lucide="arrow-right" className="w-5 h-5"></i>
                      </button>
                      <button onClick={() => setActiveTab('best-seller')} className="px-8 py-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700 transition-all">
                        Jelajahi Best Seller
                      </button>
                    </div>
                  </div>

                  {/* Hero Image Showcase */}
                  <div className="relative flex justify-center">
                    <div className="w-72 h-96 rounded-2xl bg-slate-800 shadow-2xl overflow-hidden transform -rotate-6 transition-transform hover:rotate-0 duration-500 border-4 border-white dark:border-slate-700">
                      <img src={INITIAL_PRODUCTS[0].cover} alt="Hero Book" className="w-full h-full object-cover" />
                    </div>
                    <div className="w-72 h-96 rounded-2xl bg-slate-800 shadow-2xl overflow-hidden transform rotate-6 absolute top-4 hover:rotate-0 transition-transform duration-500 border-4 border-white dark:border-slate-700 -z-10 opacity-90">
                      <img src={INITIAL_PRODUCTS[1].cover} alt="Hero Book 2" className="w-full h-full object-cover" />
                    </div>
                  </div>
                </div>
              </section>
            )}

            {/* Categories Section */}
            <section className="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <h2 className="text-2xl font-bold text-slate-900 dark:text-white mb-8 flex items-center gap-2">
                <i data-lucide="grid" className="w-6 h-6 text-brand-accent"></i> Kategori Pilihan
              </h2>
              <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                {CATEGORIES.map(cat => (
                  <div 
                    key={cat.id}
                    onClick={() => setActiveTab(cat.id)}
                    className="p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700/50 hover:shadow-xl hover:border-brand-accent/50 transition-all cursor-pointer group"
                  >
                    <div className="w-12 h-12 rounded-xl bg-amber-500/10 text-brand-accent flex items-center justify-center mb-4 group-hover:bg-brand-accent group-hover:text-slate-900 transition-colors">
                      <i data-lucide={cat.icon} className="w-6 h-6"></i>
                    </div>
                    <h3 className="font-bold text-slate-900 dark:text-white group-hover:text-brand-accent transition-colors">{cat.name}</h3>
                    <p className="text-xs text-slate-400 mt-1">{cat.count} Judul Tersedia</p>
                  </div>
                ))}
              </div>
            </section>

            {/* Product Grid Section */}
            <section className="py-16 bg-slate-100/50 dark:bg-slate-800/30">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="flex justify-between items-center mb-8">
                  <div>
                    <h2 className="text-2xl font-bold text-slate-900 dark:text-white">Koleksi Terpopuler</h2>
                    <p className="text-sm text-slate-500">Buku-buku paling dicari oleh para pembaca minggu ini</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                  {INITIAL_PRODUCTS.map(product => (
                    <div key={product.id} className="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-100 dark:border-slate-700 flex flex-col justify-between group hover:shadow-2xl transition-all">
                      <div>
                        {/* Cover Image */}
                        <div className="relative aspect-[3/4] rounded-xl overflow-hidden mb-4 bg-slate-100 dark:bg-slate-900 cursor-pointer" onClick={() => setSelectedProduct(product)}>
                          <img src={product.cover} alt={product.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                          {product.isBestSeller && (
                            <span className="absolute top-3 left-3 px-3 py-1 bg-brand-accent text-slate-900 text-[10px] font-black uppercase rounded-full shadow-md">
                              Best Seller
                            </span>
                          )}
                          <button 
                            onClick={(e) => { e.stopPropagation(); toggleWishlist(product); }}
                            className="absolute top-3 right-3 p-2 rounded-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-sm text-slate-600 dark:text-slate-300 hover:text-red-500 transition-colors"
                          >
                            <i data-lucide="heart" className={`w-4 h-4 ${wishlist.some(w => w.id === product.id) ? 'fill-red-500 text-red-500' : ''}`}></i>
                          </button>
                        </div>

                        {/* Title & Author */}
                        <span className="text-[10px] font-bold text-brand-accent uppercase tracking-wider">{product.categoryLabel}</span>
                        <h3 className="font-bold text-slate-900 dark:text-white line-clamp-1 cursor-pointer hover:text-brand-accent transition-colors" onClick={() => setSelectedProduct(product)}>
                          {product.title}
                        </h3>
                        <p className="text-xs text-slate-500 mb-3">{product.author}</p>
                      </div>

                      {/* Price & Action */}
                      <div className="pt-3 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
                        <div>
                          <span className="text-xs text-slate-400 line-through block">{formatIDR(product.originalPrice)}</span>
                          <span className="text-base font-extrabold text-slate-900 dark:text-white">{formatIDR(product.price)}</span>
                        </div>
                        <button 
                          onClick={() => addToCart(product)}
                          className="p-3 bg-slate-900 dark:bg-brand-accent text-white dark:text-slate-900 rounded-xl hover:opacity-90 transition-opacity"
                        >
                          <i data-lucide="shopping-cart" className="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* Newsletter Section */}
            <section className="py-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="bg-brand-navy dark:bg-slate-800 rounded-3xl p-8 sm:p-12 text-center text-white relative overflow-hidden">
                <div className="relative z-10 max-w-2xl mx-auto">
                  <i data-lucide="mail" className="w-12 h-12 text-brand-accent mx-auto mb-4"></i>
                  <h2 className="text-3xl font-extrabold mb-3">Jangan Lewatkan Buku Baru & Promo</h2>
                  <p className="text-slate-300 text-sm mb-8">Dapatkan rekomendasi buku mingguan, rilis komik terbaru, dan voucher diskon eksklusif langsung di inbox-mu.</p>
                  
                  {newsletterSuccess ? (
                    <div className="p-4 bg-emerald-500/20 border border-emerald-500 text-emerald-300 rounded-xl font-medium">
                      ✓ Terima kasih telah berlangganan newsletter BookVerse!
                    </div>
                  ) : (
                    <form onSubmit={(e) => { e.preventDefault(); setNewsletterSuccess(true); }} className="flex flex-col sm:flex-row gap-3">
                      <input 
                        type="email" 
                        required 
                        placeholder="Masukkan alamat email kamu..."
                        className="flex-grow px-5 py-3.5 rounded-xl text-slate-900 bg-white dark:bg-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-accent text-sm"
                      />
                      <button type="submit" className="px-8 py-3.5 bg-brand-accent text-slate-900 font-bold rounded-xl hover:bg-brand-accentHover transition-colors text-sm whitespace-nowrap">
                        Berlangganan
                      </button>
                    </form>
                  )}
                </div>
              </div>
            </section>
          </main>

          {/* Cart Drawer */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/50 backdrop-blur-sm">
              <div className="w-full max-w-md bg-white dark:bg-slate-900 h-full p-6 flex flex-col justify-between shadow-2xl">
                <div>
                  <div className="flex items-center justify-between border-b pb-4 dark:border-slate-800">
                    <h3 className="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
                      <i data-lucide="shopping-bag" className="w-5 h-5 text-brand-accent"></i> Keranjang Belanja
                    </h3>
                    <button onClick={() => setIsCartOpen(false)} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full">
                      <i data-lucide="x" className="w-5 h-5"></i>
                    </button>
                  </div>

                  <div className="mt-6 space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                    {cart.length === 0 ? (
                      <p className="text-center text-slate-400 py-12">Keranjang Anda masih kosong.</p>
                    ) : (
                      cart.map(item => (
                        <div key={item.id} className="flex gap-4 items-center border-b pb-4 dark:border-slate-800">
                          <img src={item.cover} alt={item.title} className="w-16 h-20 object-cover rounded-lg" />
                          <div className="flex-grow">
                            <h4 className="font-bold text-sm text-slate-900 dark:text-white">{item.title}</h4>
                            <p className="text-xs text-slate-400">{formatIDR(item.price)}</p>
                            <span className="text-xs font-semibold text-brand-accent">Qty: {item.qty}</span>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>

                <div className="border-t pt-4 dark:border-slate-800">
                  <div className="flex justify-between items-center mb-4">
                    <span className="text-slate-500 font-medium">Total:</span>
                    <span className="text-xl font-extrabold text-slate-900 dark:text-white">{formatIDR(cartTotal)}</span>
                  </div>
                  <button 
                    disabled={cart.length === 0}
                    className="w-full py-4 bg-brand-accent text-slate-900 font-bold rounded-xl disabled:opacity-50 hover:bg-brand-accentHover transition-colors"
                  >
                    Lanjut ke Pembayaran
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 py-12 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-lg bg-brand-accent flex items-center justify-center text-slate-900 font-bold">BV</div>
                <span className="text-lg font-bold text-white">BookVerse</span>
              </div>
              <p className="text-xs">© 2026 BookVerse. Hak Cipta Dilindungi Undang-Undang.</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
